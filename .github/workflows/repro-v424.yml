name: Reproducibility check — v4.2.4 on ubuntu-latest

# Manual-only. Rebuilds the exact v4.2.4 tag on a stock GitHub Actions ubuntu-latest
# runner, unsigned, to test whether the runner environment (core count, memory,
# worker-pool sizing) explains the classes.dex/classes2.dex/baseline.prof gap found
# between two independent local builds (macOS/arm64/Oracle-JDK-21 and
# Linux/x86_64/Temurin-21 under Docker/QEMU — both agree with each other byte-for-byte,
# both disagree with the owner's released APK in the same 3 entries) and the owner's
# own CI-produced release. No signing, no secrets: this only needs the unsigned
# standard/release APK plus its R8 mapping.txt for a direct diff.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v4.2.4
        uses: actions/checkout@v4
        with:
          ref: v4.2.4
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Runner facts
        run: |
          echo "--- nproc ---"
          nproc
          echo "--- free -m ---"
          free -m
          echo "--- java -version ---"
          java -version
          echo "--- uname -a ---"
          uname -a

      - name: Build APK (mirrors the owner's CI's assembleRelease step)
        env:
          VERSION_CODE: '40204'
          VERSION_NAME: '4.2.4'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload standard/release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-standard-release
          path: app/build/outputs/apk/standard/release/*.apk
          if-no-files-found: error

      - name: Upload x86_64/release APK (if produced)
        uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64-release
          path: app/build/outputs/apk/x86_64/release/*.apk
          if-no-files-found: ignore

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/standardRelease/
          if-no-files-found: error
